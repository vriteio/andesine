on:
  push:
    branches: [vrite]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    name: Publish Vrite Landing Page to Cloudflare Pages
    env:
      VRITE_ACCESS_TOKEN: o3qiG1nPs_1kG17He8smz:OOdP6YHsBTUDv78dVPko5
      VRITE_CONTENT_GROUP_ID: 640b816da3d81d99daed3475
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: PNPM
        uses: pnpm/action-setup@v4
      - name: Build
        run: pnpm install && pnpm run build --filter @vrite/landing-page
      - name: Publish to Cloudflare Pages
        run: npx -y wrangler@4 pages deploy apps/landing-page/dist --project-name=vrite-landing-page
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
